[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rupert"
version = "0.9.0"
description = "Local-first, low-cost personal assistant hub"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Atatoriz"}]
dependencies = []

[project.optional-dependencies]
voice = ["sounddevice>=0.5,<1"]
tts = ["piper-tts==1.8.0"]
wake = ["sounddevice>=0.5,<1", "openwakeword==0.6.0"]
full = ["sounddevice>=0.5,<1", "piper-tts==1.8.0"]

[project.scripts]
rupert = "rupert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
